<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="Inter,system-ui,sans-serif">
  <rect width="1280" height="700" fill="#0b1423" rx="16"/>

  <text x="640" y="48" font-size="22" font-weight="bold" fill="#edf3ff" text-anchor="middle">Wiring schematic</text>
  <text x="640" y="70" font-size="12" fill="#8fa1bc" text-anchor="middle">receiver board (ESP32 &#8594; L298N) &#183; transmitter IMU (ESP32 &#8596; MPU6050) &#183; power path with E-STOP</text>

  <!-- ================= MPU6050 ================= -->
  <rect x="80" y="190" width="210" height="170" rx="10" fill="#152743" stroke="#3e5a80"/>
  <text x="185" y="212" font-size="13" font-weight="bold" fill="#edf3ff" text-anchor="middle">MPU6050 / GY-521</text>
  <text x="185" y="230" font-size="10" fill="#e9c46a" text-anchor="middle">wrist controller</text>
  <text x="150" y="247" font-size="11" fill="#e9c46a" text-anchor="end">VCC</text>
  <text x="150" y="287" font-size="11" fill="#e9c46a" text-anchor="end">GND</text>
  <text x="150" y="327" font-size="11" fill="#e9c46a" text-anchor="end">SDA</text>
  <text x="150" y="367" font-size="11" fill="#e9c46a" text-anchor="end">SCL</text>

  <!-- ================= ESP32 ================= -->
  <rect x="300" y="150" width="190" height="320" rx="10" fill="#152743" stroke="#3e5a80"/>
  <text x="395" y="140" font-size="13" font-weight="bold" fill="#7ca7ff" text-anchor="middle">ESP32 DevKit V1</text>
  <text x="395" y="310" font-size="20" fill="#20334a" text-anchor="middle">ESP32</text>

  <!-- ESP32 <- MPU6050 (left) -->
  <g stroke="#e9c46a" stroke-width="2">
    <line x1="290" y1="245" x2="300" y2="245"/>
    <line x1="290" y1="285" x2="300" y2="285"/>
    <line x1="290" y1="325" x2="300" y2="325"/>
    <line x1="290" y1="365" x2="300" y2="365"/>
  </g>
  <g fill="#e9c46a" font-size="11">
    <text x="315" y="249">3V3</text>
    <text x="315" y="289">GND</text>
    <text x="315" y="329">GPIO21</text>
    <text x="315" y="369">GPIO22</text>
  </g>
  <g fill="#20334a" font-size="9">
    <circle cx="295" cy="245" r="3" fill="#e9c46a"/>
    <circle cx="295" cy="285" r="3" fill="#e9c46a"/>
    <circle cx="295" cy="325" r="3" fill="#e9c46a"/>
    <circle cx="295" cy="365" r="3" fill="#e9c46a"/>
  </g>

  <!-- ESP32 -> L298N (right) -->
  <g stroke="#7ca7ff" stroke-width="2">
    <line x1="490" y1="180" x2="690" y2="180"/>
    <line x1="490" y1="220" x2="690" y2="220"/>
    <line x1="490" y1="260" x2="690" y2="260"/>
    <line x1="490" y1="330" x2="690" y2="330"/>
    <line x1="490" y1="370" x2="690" y2="370"/>
    <line x1="490" y1="410" x2="690" y2="410"/>
    <line x1="490" y1="450" x2="690" y2="450"/>
  </g>
  <g fill="#7ca7ff" font-size="11">
    <text x="500" y="184">GPIO32</text>
    <text x="500" y="224">GPIO25</text>
    <text x="500" y="264">GPIO26</text>
    <text x="500" y="334">GPIO33</text>
    <text x="500" y="374">GPIO27</text>
    <text x="500" y="414">GPIO14</text>
    <text x="500" y="454">GND (common)</text>
  </g>
  <g fill="#7ca7ff" font-size="11">
    <text x="760" y="184">ENA</text>
    <text x="760" y="224">IN1</text>
    <text x="760" y="264">IN2</text>
    <text x="760" y="334">IN3</text>
    <text x="760" y="374">IN4</text>
    <text x="760" y="414">ENB</text>
    <text x="760" y="454">GND</text>
  </g>

  <!-- ================= L298N ================= -->
  <rect x="690" y="140" width="300" height="400" rx="10" fill="#152743" stroke="#3e5a80"/>
  <text x="840" y="134" font-size="13" font-weight="bold" fill="#7ca7ff" text-anchor="middle">L298N dual H-bridge</text>
  <text x="840" y="172" font-size="10" fill="#8fa1bc" text-anchor="middle">remove ENA / ENB jumper caps</text>

  <!-- Motor outputs -->
  <line x1="990" y1="240" x2="1040" y2="245" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="990" y1="370" x2="1040" y2="365" stroke="#ff6b6b" stroke-width="2"/>
  <text x="1015" y="232" font-size="10" fill="#ffb3c0" text-anchor="middle">MOTOR A</text>
  <text x="1015" y="362" font-size="10" fill="#ffb3c0" text-anchor="middle">MOTOR B</text>
  <circle cx="995" cy="240" r="3" fill="#ff6b6b"/>
  <circle cx="995" cy="370" r="3" fill="#ff6b6b"/>

  <rect x="1040" y="210" width="170" height="70" rx="8" fill="#152743" stroke="#5c6b2e"/>
  <text x="1125" y="238" font-size="12" font-weight="bold" fill="#edf3ff" text-anchor="middle">MOTOR A</text>
  <text x="1125" y="258" font-size="10" fill="#8fa1bc" text-anchor="middle">left wheel</text>

  <rect x="1040" y="340" width="170" height="70" rx="8" fill="#152743" stroke="#5c6b2e"/>
  <text x="1125" y="368" font-size="12" font-weight="bold" fill="#edf3ff" text-anchor="middle">MOTOR B</text>
  <text x="1125" y="388" font-size="10" fill="#8fa1bc" text-anchor="middle">right wheel</text>

  <!-- Power path -->
  <rect x="80" y="580" width="240" height="90" rx="10" fill="#152743" stroke="#ff6b6b"/>
  <text x="200" y="612" font-size="13" font-weight="bold" fill="#edf3ff" text-anchor="middle">BATTERY</text>
  <text x="200" y="632" font-size="11" fill="#8fa1bc" text-anchor="middle">e.g. 12 V DC supply</text>
  <text x="312" y="627" font-size="14" font-weight="bold" fill="#ff6b6b">+</text>
  <text x="312" y="668" font-size="14" font-weight="bold" fill="#7d8597">&#8722;</text>

  <rect x="400" y="580" width="200" height="90" rx="10" fill="#5a2635" stroke="#ff657a"/>
  <text x="500" y="612" font-size="13" font-weight="bold" fill="#ffdce2" text-anchor="middle">E-STOP (NC)</text>
  <text x="500" y="632" font-size="11" fill="#ffb3c0" text-anchor="middle">in series with battery +</text>
  <circle cx="412" cy="625" r="4" fill="#7d8597"/>
  <circle cx="588" cy="625" r="4" fill="#7d8597"/>

  <g stroke="#ff6b6b" stroke-width="3">
    <line x1="320" y1="625" x2="408" y2="625"/>
    <line x1="592" y1="625" x2="780" y2="625"/>
    <line x1="780" y1="625" x2="780" y2="547"/>
  </g>
  <text x="700" y="602" font-size="10" fill="#ff6b6b">towards VIN</text>

  <g stroke="#7d8597" stroke-width="3">
    <line x1="180" y1="670" x2="180" y2="700"/>
    <line x1="180" y1="702" x2="880" y2="702"/>
    <line x1="880" y1="702" x2="880" y2="547"/>
  </g>

  <circle cx="780" cy="545" r="5" fill="#ff6b6b"/>
  <text x="780" y="530" font-size="10" fill="#ff6b6b" text-anchor="middle">VIN (motor supply)</text>
  <circle cx="880" cy="545" r="5" fill="#7d8597"/>
  <text x="880" y="530" font-size="10" fill="#7d8597" text-anchor="middle">GND</text>

  <text x="640" y="652" font-size="11" fill="#8fa1bc" text-anchor="middle">Common ground: ESP32 GND &#8596; L298N GND &#8596; battery &#8722;</text>
  <text x="640" y="672" font-size="11" fill="#8fa1bc" text-anchor="middle">Power the ESP32 separately (USB / 5 V); the L298N runs from the battery.</text>
</svg>